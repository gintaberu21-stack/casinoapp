<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#140e10">
  <title>GAME DUEL — ゲームロビー</title>
  <link rel="stylesheet" href="./rooms.css">
</head>
<body>
  <main class="design-preview" aria-label="GAME DUEL ゲームロビーのデザインプレビュー">
    <img class="lobby-design" src="./assets/rooms/lobby-design.png" alt="GAME DUEL。遊ぶ部屋を選んでください。ROOM 01 ブラックジャック、ROOM 02 ナンバーホイール（ルーレット）、ROOM 03 絵柄合わせ。絵柄合わせは準備中です。" width="864" height="1824">
    <a class="image-action blackjack-entry" href="./index.html" aria-label="ブラックジャックの部屋に入る"><span class="sr-only">ブラックジャックの部屋に入る</span></a>
    <a class="image-action roulette-entry" href="./roulette.html" aria-label="ルーレットの部屋に入る"><span>部屋に入る</span><span aria-hidden="true">→</span></a>
    <button class="image-action preview-profile" type="button" aria-label="アカウントについて" data-info="profile"></button>
    <a class="image-action preview-lobby" href="./rooms.html" aria-label="ロビー" aria-current="page"></a>
    <button class="image-action preview-record" type="button" aria-label="戦績" data-info="record"></button>
    <button class="image-action preview-help" type="button" aria-label="遊び方" data-info="help"></button>
  </main>
  <dialog id="preview-info"><button class="dialog-close" type="button" aria-label="閉じる">×</button><h2 id="preview-title"></h2><p id="preview-text"></p></dialog>
  <script type="module">
    const dialog = document.getElementById('preview-info');
    const contents = {
      profile: ['アカウント', 'このページはデザインプレビューです。画像内の名前とポイントはサンプルです。実際のアカウントはブラックジャックのホーム画面で確認できます。'],
      record: ['戦績', 'ブラックジャックの部屋に入り、ホーム画面の「戦績」から確認できます。'],
      help: ['遊び方', 'ブラックジャックの「部屋に入る」を押すと、CASINO DUELのホーム画面へ移動します。ナンバーホイールの「部屋に入る」を押すとルーレットを遊べます。絵柄合わせは準備中です。']
    };
    document.querySelectorAll('[data-info]').forEach(button => button.addEventListener('click', () => {
      const [title, text] = contents[button.dataset.info];
      document.getElementById('preview-title').textContent = title;
      document.getElementById('preview-text').textContent = text;
      dialog.showModal();
    }));
    dialog.querySelector('button').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
  </script>
</body>
</html>
