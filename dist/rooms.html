<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#140e10" />
    <title>ROYAL PLAY — ゲームロビー</title>
    <link rel="stylesheet" href="./rooms.css?v=slider-photo-editor-1" />
  <link rel="stylesheet" href="./rank-decoration.css?v=rank-panels-4" />
  </head>
  <body>
    <main class="design-preview" aria-label="ROYAL PLAY ゲームロビーのデザインプレビュー">
      <img
        class="lobby-design"
        src="./assets/rooms/lobby-design.png"
        alt="ROYAL PLAY。遊ぶ部屋を選んでください。ROOM 01 CAJINODUEL（ブラックジャック）、ROOM 02 ナンバーホイール（ルーレット）、ROOM 03 絵柄合わせ（スロット）。"
        width="864"
        height="1824"
      />
      <span class="lobby-brand-title"><span>ROYAL PLAY</span><small class="lobby-brand-subtitle">GAME LOBBY</small></span>
      <span class="cajino-room-title">CASINODUEL</span>
      <div class="lobby-wallet" id="lobby-wallet" aria-live="polite">接続中…</div>
      <a
        class="image-action blackjack-entry"
        href="./index.html"
        aria-label="ブラックジャックの部屋に入る"
        ><span class="sr-only">ブラックジャックの部屋に入る</span></a
      >
      <a
        class="image-action roulette-entry"
        href="/roulette.html"
        aria-label="ルーレットの部屋に入る"
        title="ルーレットを遊ぶ"
        ><span>部屋に入る</span><span aria-hidden="true">→</span></a
      >
      <a
        class="image-action roulette-entry slot-entry"
        href="./slot.html"
        aria-label="絵柄合わせ（スロット）の部屋に入る"
        title="スロットを遊ぶ"
        ><span>部屋に入る</span><span aria-hidden="true">→</span></a
      >
      <button
        class="image-action preview-profile"
        type="button"
        aria-label="アカウントについて"
        data-info="profile"
      ><svg class="profile-default-icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="11" r="6"/><path d="M5 29v-3a11 11 0 0 1 22 0v3Z"/></svg></button>
      <button class="ranking-crown" id="rankings-open" type="button" aria-label="所持チップランキング" aria-haspopup="dialog" aria-controls="rankings-dialog" title="所持チップランキング"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 9 10 15 16 5 22 15 28 9 25 25H7Z"/><path d="M8 29H24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <a
        class="image-action preview-lobby"
        href="./rooms.html"
        aria-label="ロビー"
        aria-current="page"
      ></a>
      <button
        class="image-action preview-record"
        type="button"
        aria-label="戦績"
        data-info="record"
      ></button>
      <button
        class="image-action preview-help"
        type="button"
        aria-label="遊び方"
        data-info="help"
      ></button>
    </main>
    <dialog class="lobby-account" id="lobby-account"
      ><form novalidate id="lobby-account-form"
        ><p>WELCOME TO</p><h2>ROYAL PLAY</h2><span class="account-suit" aria-hidden="true">♦</span
        ><label for="lobby-name">最初にニックネームを決めてください</label
        ><input
          id="lobby-name" aria-describedby="lobby-account-error"
          type="text"
          autocomplete="nickname"
          placeholder="ニックネーム"
          required
        /><button type="submit" id="lobby-register">アカウントを作成</button
        ><p id="lobby-account-error" role="status" aria-live="polite"></p
        ><small
          >全ゲーム共通のアカウントです。<br />このブラウザにアカウント情報を保存します。</small
        ></form
      ></dialog
    >
    <script type="module" src="./js/rooms-account.js?v=2"></script>
    <dialog id="rankings-dialog" class="rankings-dialog" aria-labelledby="rankings-title">
      <header class="rankings-heading">
        <div><p>ROYAL PLAY / HALL OF FAME</p><h2 id="rankings-title">所持チップランキング</h2></div>
        <button id="rankings-close" class="rankings-close" type="button" aria-label="ランキングを閉じる">×</button>
      </header>
      <p class="rankings-description">現在の所持チップ数でランキング。同じ端末での二人対戦は対象外です。</p>
      <div class="rankings-toolbar"><p id="rankings-status" role="status" aria-live="polite"></p><button id="rankings-refresh" type="button">更新</button></div>
      <div id="rankings-content"></div>
      <p class="rankings-note">現在アカウントに保存されている所持チップ数で順位を表示します。同額はID順に表示します。</p>
    </dialog>
    <script type="module" src="./js/rankings.js"></script>
    <dialog id="account-profile-dialog" class="account-profile-dialog" aria-labelledby="account-player-name">
      <button id="account-edit" class="account-edit" type="button" aria-label="プロフィールを編集" title="プロフィールを編集">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
      <button id="account-close" class="dialog-close" type="button" aria-label="アカウントを閉じる">×</button>
      <div class="account-card">
        <section class="account-details">
          <h2 id="account-player-name">プレイヤー</h2>
          <label class="account-name-field" id="account-name-field" hidden>プレイヤー名<input id="account-name-input" form="account-edit-form" type="text" aria-describedby="account-profile-status" autocomplete="nickname" required></label>
          <p class="account-id">ID <span id="account-player-id">—</span></p>
          <p class="account-chips"><strong id="account-player-chips">—</strong><span>CHIP</span></p>
        </section>
        <div class="account-picture-area">
          <label class="account-picture" id="account-picture-button">
            <input id="account-photo-file-avatar" class="account-file-input" type="file" accept="image/*" aria-label="アイコン写真を選ぶ" disabled>
            <img id="account-avatar" alt="プレイヤーのアイコン" hidden>
            <span class="account-avatar-default" id="account-avatar-default" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="35" r="17"/><path d="M19 90v-8a31 31 0 0 1 62 0v8Z"/></svg></span>
          </label>
          <span class="account-picture-hint" id="account-picture-hint" hidden>タップして写真を変更</span>
        </div>
      </div>
      <form id="account-edit-form" hidden novalidate>
        <div class="account-photo-actions"><label id="account-photo-select" class="account-photo-select">写真ライブラリから選択<input id="account-photo-file" class="account-file-input" type="file" accept="image/*" aria-label="写真ライブラリから選択"></label><button id="account-photo-remove" type="button">写真を削除</button></div>
        <fieldset id="account-photo-crop" class="account-photo-crop" hidden><legend>写真の位置・大きさ</legend>
          <label>拡大<input id="account-photo-zoom" type="range" min="1" max="3" step="0.01" value="1"></label>
          <label>左右<input id="account-photo-x" type="range" min="-100" max="100" value="0"></label>
          <label>上下<input id="account-photo-y" type="range" min="-100" max="100" value="0"></label>
        </fieldset>
        <div class="account-edit-actions"><button id="account-edit-cancel" type="button">キャンセル</button><button id="account-edit-save" type="submit">保存する</button></div>
      </form>
      <p id="account-profile-status" class="account-profile-status" role="status" aria-live="polite"></p>
    </dialog>
    <script type="module" src="./js/account-profile.js?v=rank-panels-1"></script>
    <dialog id="preview-info"
      ><button class="dialog-close" type="button" aria-label="閉じる">×</button
      ><h2 id="preview-title"></h2><p id="preview-text"></p
    ></dialog>
    <script type="module">
      const dialog = document.getElementById("preview-info");
      const contents = {
        profile: ["アカウント", "アカウントを接続しています。"],
        record: ["戦績", "ブラックジャックの部屋に入り、ホーム画面の「戦績」から確認できます。"],
        help: [
          "遊び方",
          "各部屋の「部屋に入る」からゲームへ移動できます。絵柄合わせの部屋ではスロットを遊べます。ブラックジャックとスロットは同じアカウントのチップを使用します。",
        ],
      };
      document.querySelectorAll('[data-info]:not([data-info="profile"])').forEach((button) =>
        button.addEventListener("click", () => {
          let [title, text] = contents[button.dataset.info];
          if (button.dataset.info === "profile") {
            let account;
            try {
              account = JSON.parse(localStorage.getItem("casinoDuel.accountProfile"));
            } catch {}
            if (account)
              text = `${account.name} / ID ${account.playerId ?? "接続中"} / ${Number(account.chips ?? 0).toLocaleString("ja-JP")} CHIP`;
          }
          document.getElementById("preview-title").textContent = title;
          document.getElementById("preview-text").textContent = text;
          dialog.showModal();
        }),
      );
      dialog.querySelector("button").addEventListener("click", () => dialog.close());
      dialog.addEventListener("click", (event) => {
        if (event.target === dialog) dialog.close();
      });
    </script>
    <script type="module" src="./js/button-sounds.js?v=sample-1"></script>
    <script type="module" src="./js/shared-footer.js?v=local-win-rate-2"></script>
  </body>
</html>
